spring.application.name=report

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/school_db
spring.datasource.username=root
spring.datasource.password=root

# auto create tables if not exists
spring.jpa.hibernate.ddl-auto=update

# kafka configuration
spring.kafka.bootstrap-servers=localhost:9092

# producer configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.JsonSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# consumer configuration
# spring.kafka.consumer.group-id=report-group
# spring.kafka.consumer.auto-offset-reset=earliest

# spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# if you later use JsonDeserializer, set trusted packages
# spring.kafka.consumer.properties.spring.json.trusted.packages=*

# enable debug logging for Kafka and Spring Kafka to troubleshoot listener/consumer issues
# logging.level.org.springframework.kafka=DEBUG
# logging.level.org.apache.kafka=DEBUG